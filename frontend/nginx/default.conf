# Serves the SPA and proxies /api to the API container, so browser and API share one origin (ADR-0002): the session
# cookie stays SameSite=Strict and no CORS is needed. TLS terminates in front of this container (load balancer or
# edge proxy), which must set X-Forwarded-Proto.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The API accepts at most 1 MB per request.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Liveness and readiness (plain text "Healthy"/"Unhealthy"; no details are exposed).
    location /health/ {
        proxy_pass http://api:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Swagger UI exists only when the API runs with Swagger__Enabled=true (404 otherwise).
    location /swagger/ {
        proxy_pass http://api:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Fingerprinted build assets can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths fall back to the SPA shell, which is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
